<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intramurals 2026 Taskings Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f2f2f2;--card:#fff;--tx:#1a1a1a;--mu:#6c6c6c;--bd:#e0e0e0;--red:#d00;--bar:#e9e9e9;--note:#f6f6f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#1b1b1b;--tx:#f5f5f5;--mu:#a0a0a0;--bd:#2f2f2f;--bar:#262626;--note:#242424}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#1b1b1b;--tx:#f5f5f5;--mu:#a0a0a0;--bd:#2f2f2f;--bar:#262626;--note:#242424}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Montserrat",Arial,sans-serif}
.cd,.top b,h1,.tile,.hd,.nm,.n,.tag,.stt,.rl b,.lbl{font-family:"Montserrat",Arial,sans-serif}
.top{background:#000;color:#fff;border-bottom:3px solid var(--red)}
.in{max-width:760px;margin:0 auto;padding:0 14px}
.top .in{display:flex;align-items:center;gap:10px;height:56px}
.logo{height:40px;width:auto;display:block}
.top b{font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.top span{margin-left:auto;font:700 12px "Montserrat",Arial,sans-serif;letter-spacing:.1em;color:#bbb;text-transform:uppercase}
.title{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 0 12px}
h1{font-size:23px;line-height:1.05;margin:0;text-transform:uppercase;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font:700 12px "Montserrat",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.bar{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.sb{background:var(--card);border-bottom:1px solid var(--bd)}
.sb .in,.rs .in{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
.tile{flex:none;min-width:92px;border:1px solid var(--bd);border-top:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:4px;padding:6px 10px;text-align:left;cursor:pointer;text-transform:uppercase}
.tile.on{border-top-color:var(--red);background:var(--bar)}
.tile small{display:block;font-size:11px;color:var(--mu);letter-spacing:.06em}
.tile b{display:block;font-size:15px;line-height:1.1}
.tile em{font-style:normal;font-size:11px;font-weight:700;color:var(--red);letter-spacing:.05em}
.tile em.fin{color:var(--mu)}
.rs{background:var(--card);border-bottom:1px solid var(--bd)}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding-top:10px;font-weight:700}
.rl{flex:none;width:70px;text-align:center;background:none;border:0;padding:0;cursor:pointer;color:var(--tx);font:inherit}
.rl img,.rl .all{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 7px;border:4px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--gr) border-box}
.rl .all{display:flex;align-items:center;justify-content:center;font:700 16px "Montserrat",Arial,sans-serif;color:#fff;background:linear-gradient(var(--pc),var(--pc)) padding-box,var(--gr) border-box}
.rl.on img,.rl.on .all{outline:3px solid var(--red);outline-offset:5px}
.rl b{display:block;font-size:10.5px;text-transform:uppercase;background:var(--gb);color:var(--tc);text-shadow:var(--ts);border-radius:3px;padding:2px 0}
.rl small{font-size:11px;color:var(--mu)}
.hd{background:var(--bar);padding:7px 14px;margin:18px -14px 0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-left:4px solid var(--red)}
.t{display:block;min-height:122px;overflow:hidden;background:var(--gb);color:var(--tc);text-shadow:var(--ts);padding:12px 126px 12px 14px;margin:0 -14px 6px;position:relative}
.t.done{opacity:.55}
.cut{position:absolute;right:8px;bottom:0;height:110px;width:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.n{font-weight:700;font-size:16px;line-height:1.1;text-transform:uppercase}
.nm{display:inline-block;margin-top:4px;background:none;color:inherit;text-shadow:inherit;border-radius:0;padding:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tags{margin-top:5px}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:1px 6px;margin-right:4px;background:none;border:1px solid currentColor;color:inherit;text-shadow:inherit}
.tag.NL,.tag.FB{color:inherit}
.stt{cursor:pointer;display:inline-block;margin-top:9px}
.stt input{display:none}
.stt span{display:block;min-width:78px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid currentColor;background:none;color:inherit;text-shadow:inherit;border-radius:3px;padding:5px 8px}
.stt input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.note{display:none;margin:-6px -14px 6px;background:var(--bar);color:var(--tx);border-left:4px solid var(--red);font-size:12.5px;padding:10px 14px;line-height:1.4}
.t.open+.note{display:block}
.t.has{cursor:pointer}
.note small{display:block;margin-top:3px;font-weight:600}
.empty{padding:30px 0;color:var(--mu);text-align:center}

body.lock{overflow:hidden}
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 70% at 50% 100%,#5a0000 0%,#150000 45%,#000 80%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;transition:opacity .8s ease,transform .8s ease}
.splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-logos{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.sp-logos img{display:block;height:auto}
.sp-logos .sp-nd{height:84px;width:auto;order:3}.sp-logos .sp-bg{height:84px;width:auto;order:1}
.sp-div{order:2;width:2px;height:84px;background:linear-gradient(transparent,#d00,transparent)}
.sp-eye{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#bbb;font-weight:700}
.sp-t{font-size:clamp(34px,11.5vw,56px);font-weight:800;line-height:1;text-transform:uppercase;margin:12px 0 0}
.sp-t b{display:block;color:#d00;letter-spacing:.04em}
.sp-sub{margin-top:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#aaa;font-weight:600}
.sp-btn{margin-top:36px;background:#d00;color:#fff;border:0;border-radius:4px;font:800 18px "Montserrat",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:15px 54px 15px 58px;cursor:pointer;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(221,0,0,.55)}70%{box-shadow:0 0 0 16px rgba(221,0,0,0)}100%{box-shadow:0 0 0 0 rgba(221,0,0,0)}}
.sp-foot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:10px;letter-spacing:.16em;color:#777;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.sp-btn{animation:none}.splash{transition:none}}
</style></head><body class="lock">
